<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Base styles so the page stays legible if the Tailwind CDN is unreachable. */
  body { background:#0b0f14; color:#e6edf3; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; margin:0; }
  .pane { background:#111820; border:1px solid #1f2a37; border-radius:12px; }
  .scroll { overflow-y:auto; scrollbar-width:thin; scrollbar-color:#2d3b4d transparent; }
  .scroll::-webkit-scrollbar { width:8px; }
  .scroll::-webkit-scrollbar-thumb { background:#2d3b4d; border-radius:4px; }
  @keyframes pulse-me { 0%,100% { background:#14532d; } 50% { background:#166534; } }
  .my-turn { animation: pulse-me 1.4s ease-in-out infinite; }
  .pos-QB{color:#f87171} .pos-RB{color:#4ade80} .pos-WR{color:#60a5fa}
  .pos-TE{color:#fbbf24} .pos-K{color:#c084fc} .pos-DST{color:#94a3b8} .pos-\?{color:#64748b}
</style>
</head>
<body class="h-screen">

<!-- Banners: auth failure and stale connection. Silent staleness is the worst
     possible failure mode (§8), so these are loud and always on top. -->
<div id="banner" class="hidden px-4 py-3 text-sm font-semibold text-center"></div>

<header class="flex items-center justify-between px-4 py-2 border-b border-slate-800">
  <h1 class="text-lg font-bold tracking-tight">Draft Dashboard</h1>
  <div class="flex items-center gap-4 text-sm">
    <span id="status-text" class="text-slate-400">connecting…</span>
    <span class="flex items-center gap-2">
      <span id="dot" class="inline-block w-3 h-3 rounded-full bg-slate-500"></span>
      <span id="dot-label" class="text-slate-400">—</span>
    </span>
    <a href="/analysis" class="px-2 py-1 rounded border border-slate-700 text-slate-300 hover:bg-slate-800">team report</a>
    <button id="sound-toggle" class="px-2 py-1 rounded border border-slate-700 text-slate-300 hover:bg-slate-800">🔊 on</button>
  </div>
</header>

<main class="grid gap-3 p-3" style="grid-template-columns: 22rem 1fr 26rem; height: calc(100vh - 3.25rem);">

  <!-- LEFT — draft board (§8) -->
  <section class="pane flex flex-col min-h-0">
    <h2 class="px-3 py-2 text-xs uppercase tracking-widest text-slate-400 border-b border-slate-800">
      Draft board <span id="pick-count" class="text-slate-600"></span>
    </h2>
    <div id="board" class="scroll flex-1 p-2 space-y-1 text-sm"></div>
  </section>

  <!-- CENTER — on the clock (§8) -->
  <section class="flex flex-col gap-3 min-h-0">
    <div id="clock" class="pane flex-1 flex flex-col items-center justify-center text-center p-6">
      <div class="text-xs uppercase tracking-widest text-slate-400">On the clock</div>
      <div id="clock-team" class="text-6xl font-black mt-3 leading-tight">—</div>
      <div id="clock-meta" class="text-2xl text-slate-400 mt-2">—</div>
      <div id="next-pick" class="mt-8 text-3xl font-bold text-amber-300"></div>
    </div>
    <div class="pane p-3 min-h-0 flex flex-col" style="max-height:40%">
      <h2 class="text-xs uppercase tracking-widest text-slate-400 mb-2">My roster</h2>
      <div id="roster" class="scroll flex-1 grid grid-cols-2 gap-x-4 gap-y-1 text-sm content-start"></div>
    </div>
  </section>

  <!-- RIGHT — recommendations (§8) -->
  <section class="pane flex flex-col min-h-0">
    <h2 class="px-3 py-2 text-xs uppercase tracking-widest text-slate-400 border-b border-slate-800">
      Recommended
    </h2>
    <div id="recs" class="scroll p-2 space-y-2 text-sm" style="max-height:58%"></div>
    <div class="border-t border-slate-800 flex flex-col min-h-0 flex-1">
      <div id="pos-tabs" class="flex gap-1 px-2 py-2 text-xs"></div>
      <div id="best" class="scroll flex-1 px-2 pb-2 space-y-1 text-sm"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const STALE_MS = 15000;              // §8: green only if a poll landed within 15s
let lastMessage = 0;
let soundOn = true;
let wasMyTurn = false;
let activeTab = null;
let latest = null;

// ---- alerts ------------------------------------------------------------------
if ("Notification" in window && Notification.permission === "default") {
  Notification.requestPermission();
}

function beep() {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine"; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
    osc.start(); osc.stop(ctx.currentTime + 0.9);
  } catch (e) { /* audio is a nicety; never let it break rendering */ }
}

function alertMyTurn(snap) {
  beep();
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("You're on the clock!", {
      body: `Pick #${snap.current_pick.overall} — round ${snap.current_pick.round}`,
    });
  }
}

$("sound-toggle").onclick = () => {
  soundOn = !soundOn;
  $("sound-toggle").textContent = soundOn ? "🔊 on" : "🔇 off";
};

// ---- rendering ---------------------------------------------------------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const posClass = (p) => `pos-${esc(p)}`;

function render(snap) {
  latest = snap;

  // Center pane
  const cp = snap.current_pick;
  const clock = $("clock");
  if (cp) {
    $("clock-team").textContent = cp.team_name;
    $("clock-meta").textContent = `Pick #${cp.overall} · Round ${cp.round}`;
    clock.classList.toggle("my-turn", !!cp.is_me);
    document.title = cp.is_me ? "🟢 YOUR PICK — Draft Dashboard"
                              : `#${cp.overall} ${cp.team_name} — Draft Dashboard`;
    if (cp.is_me && !wasMyTurn) alertMyTurn(snap);
    wasMyTurn = !!cp.is_me;
  } else {
    $("clock-team").textContent = snap.draft_status === "COMPLETE" ? "Draft complete" : "Waiting…";
    $("clock-meta").textContent = snap.draft_status.replace("_", " ").toLowerCase();
    clock.classList.remove("my-turn");
    wasMyTurn = false;
  }

  const np = snap.next_my_pick;
  $("next-pick").textContent = !np ? ""
    : np.picks_away === 0 ? "You are up now"
    : `Your next pick: #${np.overall}, ${np.picks_away} pick${np.picks_away === 1 ? "" : "s"} away`;

  // Left pane — chronological feed, own picks visually distinct
  $("pick-count").textContent = snap.picks.length ? `(${snap.picks.length})` : "";
  $("board").innerHTML = snap.picks.map(p => `
    <div class="flex items-baseline gap-2 px-2 py-1 rounded ${p.is_me ? "bg-emerald-900/50 ring-1 ring-emerald-600" : "odd:bg-slate-900/40"}">
      <span class="text-slate-500 tabular-nums w-12 shrink-0">${p.round}.${String(p.overall).padStart(2,"0")}</span>
      <span class="font-semibold truncate">${esc(p.player_name)}</span>
      <span class="${posClass(p.position)} font-bold shrink-0">${esc(p.position)}</span>
      <span class="text-slate-500 truncate ml-auto text-xs">${esc(p.team_name)}</span>
    </div>`).join("") || `<div class="text-slate-600 p-2">No picks yet.</div>`;

  // My roster
  const slots = snap.roster_slots || {};
  $("roster").innerHTML = Object.keys(slots).map(slot => {
    const filled = (snap.my_roster[slot] || []);
    const rows = filled.map(pl =>
      `<div class="truncate">${esc(pl.name)} <span class="${posClass(pl.position)} text-xs">${esc(pl.position)}</span></div>`).join("");
    const empty = Math.max(0, slots[slot] - filled.length);
    const blanks = "<div class='text-slate-700'>—</div>".repeat(slot === "BENCH" ? Math.min(empty,2) : empty);
    return `<div class="col-span-2 grid grid-cols-[3.5rem_1fr] gap-2 items-start">
      <span class="text-slate-500 text-xs pt-0.5">${esc(slot)}</span>
      <div>${rows}${blanks}</div></div>`;
  }).join("");

  // Right pane — recommendations, each with its reason string (§7)
  $("recs").innerHTML = snap.recommendations.map((r, i) => `
    <div class="p-2 rounded bg-slate-900/60 border border-slate-800">
      <div class="flex items-baseline gap-2">
        <span class="text-slate-600 tabular-nums">${i + 1}</span>
        <span class="font-bold truncate">${esc(r.name)}</span>
        <span class="${posClass(r.position)} font-bold">${esc(r.position)}</span>
        <span class="text-slate-500 text-xs">${esc(r.team)}</span>
        <span class="ml-auto tabular-nums text-emerald-400 font-bold">${r.score}</span>
      </div>
      <div class="text-slate-400 text-xs mt-1">${esc(r.reason)}</div>
      <div class="text-slate-600 text-xs mt-0.5 tabular-nums">
        proj ${r.projected_points} · VOR ${r.vor} · rank ${r.espn_rank} · survives ${Math.round(r.survival_prob * 100)}%
      </div>
    </div>`).join("") || `<div class="text-slate-600 p-2">No recommendations — player pool unavailable.</div>`;

  // Best available by position
  const positions = Object.keys(snap.best_available_by_position || {});
  if (positions.length && !positions.includes(activeTab)) activeTab = positions[0];
  $("pos-tabs").innerHTML = positions.map(p =>
    `<button data-pos="${esc(p)}" class="px-2 py-1 rounded ${p === activeTab ? "bg-slate-700 text-white" : "text-slate-400 hover:bg-slate-800"}">${esc(p)}</button>`).join("");
  for (const btn of $("pos-tabs").children) {
    btn.onclick = () => { activeTab = btn.dataset.pos; render(latest); };
  }
  const list = (snap.best_available_by_position || {})[activeTab] || [];
  $("best").innerHTML = list.map(p => `
    <div class="flex items-baseline gap-2 px-1">
      <span class="truncate">${esc(p.name)}</span>
      <span class="text-slate-600 text-xs">${esc(p.team)}</span>
      <span class="ml-auto text-slate-400 tabular-nums text-xs">${p.projected_points}</span>
      <span class="text-slate-600 tabular-nums text-xs w-8 text-right">#${p.espn_rank}</span>
    </div>`).join("");

  updateHealth(snap);
}

function updateHealth(snap) {
  const banner = $("banner");
  if (snap && snap.auth_error) {
    banner.className = "px-4 py-3 text-sm font-semibold text-center bg-red-700 text-white";
    banner.textContent = "ESPN returned 401 — your espn_s2 / SWID cookies have expired. "
      + "Re-copy them from DevTools into .env and restart the server.";
    return;
  }
  const age = Date.now() - lastMessage;
  const stale = !lastMessage || age > STALE_MS;
  if (stale) {
    banner.className = "px-4 py-3 text-sm font-semibold text-center bg-red-700 text-white";
    banner.textContent = `STALE — no update for ${Math.round(age / 1000)}s. `
      + `The board below may be out of date.`;
  } else {
    banner.className = "hidden";
  }
  $("dot").className = `inline-block w-3 h-3 rounded-full ${stale ? "bg-red-500" : "bg-emerald-500"}`;
  $("dot-label").textContent = stale ? "stale" : "live";
  $("dot-label").className = stale ? "text-red-400" : "text-emerald-400";
  if (snap && snap.last_updated) {
    $("status-text").textContent = `updated ${new Date(snap.last_updated).toLocaleTimeString()}`;
  }
}

// ---- transport ---------------------------------------------------------------
// SSE is primary; /api/state polling is the fallback if EventSource dies (§6).
let pollTimer = null;

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch("/api/state");
      if (!r.ok) return;
      lastMessage = Date.now();
      render(await r.json());
    } catch (e) { /* updateHealth's staleness check covers this */ }
  }, 3000);
}

function connect() {
  const es = new EventSource("/events");
  es.onmessage = (ev) => {
    lastMessage = Date.now();
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    try { render(JSON.parse(ev.data)); } catch (e) { console.error(e); }
  };
  es.onerror = () => {
    startPolling();               // keep data flowing while EventSource retries
  };
}

connect();
setInterval(() => updateHealth(latest), 1000);   // staleness must surface on its own
</script>
</body>
</html>
